org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Backend base URL for debug builds. Run `adb reverse tcp:4001 tcp:4001` first,
# for the emulator and for a phone over USB alike. We use localhost rather than
# the emulator's 10.0.2.2 alias because Android 17 (API 37) blocks apps from
# reaching local-network addresses without the ACCESS_LOCAL_NETWORK runtime
# permission; loopback isn't restricted. Override with -PapiBaseUrl=... or in
# ~/.gradle/gradle.properties.
apiBaseUrl=http://localhost:4001/
